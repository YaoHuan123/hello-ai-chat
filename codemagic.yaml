# AIChat · Capacitor Android / iOS CI
# 文档：https://docs.codemagic.io/yaml-basic-configuration/yaml-getting-started/
#
# Codemagic UI 需配置：
# 1. Environment variables
#    - VITE_API_BASE  生产 HTTPS 后端地址（如 https://api.example.com）
#    - VITE_USE_MOCK  0
# 2. android_signing（Android release）
#    - 上传 keystore，Reference name 填 aichat_keystore
# 3. ios_signing（iOS release / ad hoc）
#    - 证书 Reference name：app-common（Team → Code signing identities → iOS certificates）
#    - 描述文件：App Store / Ad Hoc .mobileprovision（Reference 如 aichat-appstore、aichat-adhoc）
# 4. App Store Connect 自动上传（ios-release）
#    - Team settings → Team integrations → Developer Portal：上传 .p8 API Key
#    - Integration 名称与团队其他 App 一致：huanqi-asc
#    - App Store Connect 中需已创建对应 Bundle ID 的 App 记录

workflows:
  android-debug:
    name: AIChat Android Debug
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
      node: 22
      vars:
        VITE_API_BASE: http://192.168.137.1:4000
        VITE_USE_MOCK: "0"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: android
          include: true
        - pattern: main
          include: true
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $CM_BUILD_DIR/frontend/node_modules
    scripts:
      - name: Install npm dependencies
        script: |
          cd frontend
          npm ci
      - name: Build web assets and sync Capacitor
        script: |
          cd frontend
          npm run sync:android
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/frontend/android/local.properties"
      - name: Build debug APK
        script: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - frontend/android/app/build/outputs/apk/debug/*.apk

  android-release:
    name: AIChat Android Release
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      java: 17
      node: 22
      android_signing:
        - aichat_keystore
      vars:
        VITE_API_BASE: http://192.168.137.1:4000
        VITE_USE_MOCK: "0"
        PACKAGE_NAME: com.aichat.app
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: android
          include: true
        - pattern: main
          include: true
      tag_patterns:
        - pattern: "v*"
          include: true
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $CM_BUILD_DIR/frontend/node_modules
    scripts:
      - name: Install npm dependencies
        script: |
          cd frontend
          npm ci
      - name: Build web assets and sync Capacitor
        script: |
          cd frontend
          npm run sync:android
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/frontend/android/local.properties"
      - name: Build release App Bundle
        script: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew bundleRelease
      - name: Build release APK
        script: |
          cd frontend/android
          ./gradlew assembleRelease
    artifacts:
      - frontend/android/app/build/outputs/bundle/release/*.aab
      - frontend/android/app/build/outputs/apk/release/*.apk

  ios-debug:
    name: AIChat iOS Debug
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
      vars:
        VITE_API_BASE: http://192.168.137.1:4000
        VITE_USE_MOCK: "0"
        XCODE_PROJECT: frontend/ios/App/App.xcodeproj
        XCODE_SCHEME: App
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: ios
          include: true
        - pattern: main
          include: true
    cache:
      cache_paths:
        - $CM_BUILD_DIR/frontend/node_modules
    scripts:
      - name: Install npm dependencies
        script: |
          cd frontend
          npm ci
      - name: Build web assets and sync Capacitor
        script: |
          cd frontend
          npm run sync:ios
      - name: Build unsigned iOS app
        script: |
          cd frontend/ios/App
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - frontend/ios/App/build/**/*.app

  ios-release:
    name: AIChat iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: huanqi-asc
    environment:
      node: 22
      xcode: latest
      ios_signing:
        certificates:
          - app-common
        provisioning_profiles:
          - aichat-appstore
      vars:
        VITE_API_BASE: http://192.168.137.1:4000
        VITE_USE_MOCK: "0"
        XCODE_PROJECT: frontend/ios/App/App.xcodeproj
        XCODE_SCHEME: App
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: ios
          include: true
        - pattern: main
          include: true
      tag_patterns:
        - pattern: "v*"
          include: true
    cache:
      cache_paths:
        - $CM_BUILD_DIR/frontend/node_modules
    scripts:
      - name: Install npm dependencies
        script: |
          cd frontend
          npm ci
      - name: Build web assets and sync Capacitor
        script: |
          cd frontend
          npm run sync:ios
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Set iOS build number
        script: |
          cd frontend/ios/App
          BUILD_NUM="${BUILD_NUMBER}"
          if [ "$BUILD_NUM" -lt 2 ]; then BUILD_NUM=2; fi
          sed -i.bak "s/CURRENT_PROJECT_VERSION = [0-9][0-9]*;/CURRENT_PROJECT_VERSION = ${BUILD_NUM};/g" App.xcodeproj/project.pbxproj
          echo "CURRENT_PROJECT_VERSION=${BUILD_NUM}"
      - name: Build ipa for distribution
        script: |
          cd frontend/ios/App
          xcode-project build-ipa \
            --project App.xcodeproj \
            --scheme App
    artifacts:
      - frontend/ios/App/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  ios-ad-hoc:
    name: AIChat iOS Ad Hoc
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
      ios_signing:
        certificates:
          - app-common
        provisioning_profiles:
          - aichat-adhoc
      vars:
        VITE_API_BASE: http://192.168.137.1:4000
        VITE_USE_MOCK: "0"
        XCODE_PROJECT: frontend/ios/App/App.xcodeproj
        XCODE_SCHEME: App
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: ios
          include: true
        - pattern: main
          include: true
    cache:
      cache_paths:
        - $CM_BUILD_DIR/frontend/node_modules
    scripts:
      - name: Install npm dependencies
        script: |
          cd frontend
          npm ci
      - name: Build web assets and sync Capacitor
        script: |
          cd frontend
          npm run sync:ios
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Build ipa for ad hoc distribution
        script: |
          cd frontend/ios/App
          xcode-project build-ipa \
            --project App.xcodeproj \
            --scheme App
    artifacts:
      - frontend/ios/App/build/ios/ipa/*.ipa
