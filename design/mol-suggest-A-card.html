<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>方案 A · 浮层卡片 · Mol 建议</title>
    <style>
      :root {
        --bg: #ededed; --surface: #fff; --text: #14171a; --muted: #6b7380;
        --border: rgba(20,23,26,0.1); --accent: #2f9e6f; --accent-soft: rgba(47,158,111,0.12);
        --shadow: 0 8px 28px rgba(20,23,26,0.14);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #dfe3ea; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--text); }
      body { display: flex; align-items: center; justify-content: center; padding: 24px; gap: 28px; flex-wrap: wrap; }
      .phone { width: 390px; height: 844px; background: var(--bg); border-radius: 40px; overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--border); display: flex; flex-direction: column; position: relative; }
      .note { max-width: 300px; font-size: 13px; line-height: 1.65; color: #6b7380; }
      .note h2 { font-size: 15px; color: #14171a; margin: 0 0 8px; }
      .note a { color: var(--accent); }
      .topbar { background: var(--surface); padding: 52px 16px 10px; border-bottom: 0.5px solid var(--border); display: flex; align-items: center; gap: 10px; }
      .topbar .back { color: var(--accent); font-size: 15px; font-weight: 600; border: none; background: none; }
      .topbar .name { flex: 1; font-size: 17px; font-weight: 600; }
      .chat { flex: 1; overflow-y: auto; padding: 12px 14px 140px; }
      .bubble { max-width: 78%; padding: 10px 12px; border-radius: 12px; margin-bottom: 10px; font-size: 15px; line-height: 1.45; background: var(--surface); border: 0.5px solid var(--border); }
      .bubble.other { border-bottom-left-radius: 4px; }
      .composer { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 12px 28px; background: #f7f7f7; border-top: 0.5px solid var(--border); display: flex; gap: 8px; }
      .composer input { flex: 1; border: 0.5px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 15px; background: var(--surface); }
      .composer .send { border: none; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 700; padding: 10px 16px; }
      .composer .mol-trigger { border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; padding: 10px 12px; border-radius: 8px; }

      /* A · 浮层卡片（现版优化） */
      .panel-a {
        position: absolute; left: 12px; right: 12px; bottom: 118px; z-index: 5;
        background: var(--surface); border-radius: 14px; border: 0.5px solid var(--border);
        box-shadow: var(--shadow); padding: 12px 14px 14px; max-height: 340px; overflow-y: auto;
      }
      .panel-a__head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
      .panel-a__head h2 { margin: 0; font-size: 16px; font-weight: 700; }
      .panel-a__actions { display: flex; gap: 8px; }
      .ghost { border: none; background: none; color: var(--accent); font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }
      .panel-a__mol { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 8px 0 6px; margin-bottom: 6px; border-top: 0.5px solid var(--border); }
      .panel-a__mol p { margin: 0; font-size: 12px; color: var(--muted); flex: 1; }
      .panel-a__mol-btn { padding: 6px 12px; border-radius: 10px; border: 0.5px solid var(--accent); background: var(--surface); color: var(--accent); font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
      .panel-a__list { list-style: none; margin: 0; padding: 0; }
      .panel-a__list li { margin-bottom: 8px; }
      .panel-a__list li:last-child { margin-bottom: 0; }
      .panel-a__item { width: 100%; text-align: left; border: 0.5px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 14px; line-height: 1.45; background: var(--surface); cursor: pointer; font-family: inherit; }
      .panel-a__item:active { background: #f7f8fb; }
    </style>
  </head>
  <body>
    <div class="phone">
      <header class="topbar">
        <button class="back" type="button">返回</button>
        <span class="name">张经理</span>
      </header>
      <div class="chat">
        <div class="bubble other">本周对接进度能同步一下吗？</div>
      </div>
      <aside class="panel-a" role="dialog" aria-label="Mol 建议">
        <div class="panel-a__head">
          <h2>Mol 建议</h2>
          <div class="panel-a__actions">
            <button type="button" class="ghost">刷新</button>
            <button type="button" class="ghost">关闭</button>
          </div>
        </div>
        <div class="panel-a__mol">
          <p>建议基于「我的 Mol」中的资料</p>
          <button type="button" class="panel-a__mol-btn">修改 Mol</button>
        </div>
        <ul class="panel-a__list">
          <li><button type="button" class="panel-a__item">您好，关于本次对接的相关事项，我想和您沟通一下具体推进细节。</button></li>
          <li><button type="button" class="panel-a__item">您好，关于近期的工作安排，我想和您沟通一下各环节的对接要求。</button></li>
          <li><button type="button" class="panel-a__item">您好，关于本次项目的落地事宜，我想和您沟通一下当前的进度卡点。</button></li>
        </ul>
      </aside>
      <div class="composer">
        <button type="button" class="mol-trigger">Mol</button>
        <input placeholder="输入消息" />
        <button type="button" class="send">发送</button>
      </div>
    </div>
    <aside class="note">
      <h2>方案 A · 浮层卡片</h2>
      <p>与当前 App 结构一致：绝对定位在 composer 上方，白卡片 + 全宽建议按钮。点击整条即采纳发送。</p>
      <p><a href="./mol-suggest-index.html">← 返回索引</a></p>
    </aside>
  </body>
</html>
