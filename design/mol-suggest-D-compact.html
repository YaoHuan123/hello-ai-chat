<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>方案 D · 紧凑列表 · Mol 建议</title>
    <style>
      :root { --bg: #ededed; --surface: #fff; --text: #14171a; --muted: #6b7380; --border: rgba(20,23,26,0.12); --accent: #4f6df5; }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: #dfe3ea; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--text); }
      body { display: flex; align-items: center; justify-content: center; padding: 24px; gap: 28px; flex-wrap: wrap; }
      .phone { width: 390px; height: 844px; background: var(--bg); border-radius: 40px; overflow: hidden; box-shadow: 0 8px 28px rgba(20,23,26,0.14); display: flex; flex-direction: column; position: relative; }
      .note { max-width: 300px; font-size: 13px; line-height: 1.65; color: #6b7380; }
      .note h2 { font-size: 15px; margin: 0 0 8px; }
      .note a { color: var(--accent); }
      .topbar { background: var(--surface); padding: 52px 16px 10px; border-bottom: 1px solid var(--border); font-size: 17px; font-weight: 600; }
      .chat { flex: 1; overflow-y: auto; padding: 12px 14px 130px; }
      .bubble { max-width: 78%; padding: 10px 12px; background: var(--surface); border-radius: 10px; font-size: 15px; border: 1px solid var(--border); margin-bottom: 10px; }
      .panel-d {
        position: absolute; left: 0; right: 0; bottom: 72px; z-index: 5;
        background: var(--surface); border-top: 1px solid var(--border);
        box-shadow: 0 -6px 20px rgba(0,0,0,0.08);
      }
      .panel-d__bar {
        display: flex; align-items: center; justify-content: space-between;
        padding: 8px 14px; background: #f7f8fb; border-bottom: 1px solid var(--border);
        font-size: 13px; font-weight: 700;
      }
      .panel-d__bar-actions { display: flex; gap: 10px; font-weight: 600; color: var(--accent); }
      .panel-d__bar-actions button { border: none; background: none; color: inherit; font: inherit; cursor: pointer; }
      .panel-d__meta { display: flex; align-items: center; justify-content: space-between; padding: 6px 14px; font-size: 11px; color: var(--muted); border-bottom: 1px solid var(--border); }
      .panel-d__meta button { border: none; background: none; color: var(--accent); font-weight: 700; font-size: 11px; cursor: pointer; font-family: inherit; }
      .panel-d__row {
        display: flex; align-items: flex-start; gap: 10px; width: 100%; padding: 10px 14px;
        border: none; border-bottom: 1px solid var(--border); background: var(--surface); text-align: left; cursor: pointer; font-family: inherit;
      }
      .panel-d__row:last-child { border-bottom: none; }
      .panel-d__num { width: 22px; height: 22px; border-radius: 6px; background: #eef1ff; color: var(--accent); font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; }
      .panel-d__text { flex: 1; font-size: 13px; line-height: 1.45; color: var(--text); }
      .panel-d__use { flex-shrink: 0; font-size: 12px; font-weight: 700; color: var(--accent); padding-top: 2px; }
      .composer { position: absolute; bottom: 0; left: 0; right: 0; padding: 8px 12px 24px; background: #f0f1f5; border-top: 1px solid var(--border); display: flex; gap: 8px; }
      .composer input { flex: 1; border: none; border-radius: 6px; padding: 10px; background: var(--surface); }
      .composer .send { border: none; background: var(--accent); color: #fff; font-weight: 600; padding: 10px 14px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <div class="phone">
      <header class="topbar">张经理</header>
      <div class="chat"><div class="bubble">本周对接进度能同步一下吗？</div></div>
      <div class="panel-d" role="dialog" aria-label="Mol 建议">
        <div class="panel-d__bar">
          <span>Mol 建议</span>
          <div class="panel-d__bar-actions">
            <button type="button">刷新</button>
            <button type="button">关闭</button>
          </div>
        </div>
        <div class="panel-d__meta">
          <span>建议基于「我的 Mol」中的资料</span>
          <button type="button">修改 Mol</button>
        </div>
        <button type="button" class="panel-d__row">
          <span class="panel-d__num">1</span>
          <span class="panel-d__text">您好，关于本次对接的相关事项，我想和您沟通一下具体推进细节。</span>
          <span class="panel-d__use">用这条</span>
        </button>
        <button type="button" class="panel-d__row">
          <span class="panel-d__num">2</span>
          <span class="panel-d__text">您好，关于近期的工作安排，我想和您沟通一下各环节的对接要求。</span>
          <span class="panel-d__use">用这条</span>
        </button>
        <button type="button" class="panel-d__row">
          <span class="panel-d__num">3</span>
          <span class="panel-d__text">您好，关于本次项目的落地事宜，我想和您沟通一下当前的进度卡点。</span>
          <span class="panel-d__use">用这条</span>
        </button>
      </div>
      <div class="composer"><input placeholder="输入消息" /><button type="button" class="send">发送</button></div>
    </div>
    <aside class="note">
      <h2>方案 D · 紧凑列表</h2>
      <p>贴底工具条风格，编号 + 单行摘要 + 右侧「用这条」。标题栏灰底，占用垂直空间小。</p>
      <p><a href="./mol-suggest-index.html">← 返回索引</a></p>
    </aside>
  </body>
</html>
