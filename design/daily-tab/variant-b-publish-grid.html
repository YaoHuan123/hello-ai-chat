<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>方案 B · 2×2 发布网格</title>
  <link rel="stylesheet" href="_shared.css" />
  <style>
    .publish-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 12px 14px 4px;
    }
    .pub-tile {
      border: none;
      background: var(--surface);
      border-radius: 16px;
      border: 0.5px solid var(--border);
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      cursor: pointer;
      font-family: inherit;
      text-align: left;
      box-shadow: 0 4px 14px rgba(20, 23, 26, 0.04);
    }
    .pub-tile__title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }
    .pub-tile__desc {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }
    .feed-card__media--square {
      aspect-ratio: 1;
      max-width: 200px;
    }
  </style>
</head>
<body>
  <a class="back-link" href="index.html">← 方案索引</a>
  <p class="mock-label">方案 B · 2×2 发布网格</p>
  <div class="phone-wrap">
    <div class="phone">
      <header class="tab-topbar">
        <h1 class="tab-topbar__title">日常</h1>
      </header>
      <div class="tab-scroll">
        <div class="publish-grid" role="group" aria-label="发布">
          <button type="button" class="pub-tile">
            <span class="pub-icon pub-icon--photo" aria-hidden>📷</span>
            <span class="pub-tile__title">拍照</span>
            <span class="pub-tile__desc">拍下此刻</span>
          </button>
          <button type="button" class="pub-tile">
            <span class="pub-icon pub-icon--video" aria-hidden>🎬</span>
            <span class="pub-tile__title">拍视频</span>
            <span class="pub-tile__desc">记录动态</span>
          </button>
          <button type="button" class="pub-tile">
            <span class="pub-icon pub-icon--text" aria-hidden>✏️</span>
            <span class="pub-tile__title">写文字</span>
            <span class="pub-tile__desc">随手记一笔</span>
          </button>
          <button type="button" class="pub-tile">
            <span class="pub-icon pub-icon--voice" aria-hidden>🎙</span>
            <span class="pub-tile__title">语音</span>
            <span class="pub-tile__desc">按住说话</span>
          </button>
        </div>

        <div class="section-head">
          <h2>我的记录</h2>
        </div>

        <section class="day-group">
          <h3 class="day-title">今天</h3>
          <ul class="feed-list">
            <li class="feed-card">
              <div class="feed-card__head">
                <div class="feed-card__meta">
                  <span class="type-badge type-badge--photo">照片</span>
                  <time class="feed-card__time">09:42</time>
                </div>
                <button type="button" class="more-btn" aria-label="更多">⋯</button>
              </div>
              <div class="feed-card__body">
                <p class="feed-card__text">晨跑后的早餐。</p>
                <div class="feed-card__media feed-card__media--square">
                  <div class="media-placeholder">照片</div>
                </div>
              </div>
            </li>
          </ul>
        </section>

        <section class="day-group">
          <h3 class="day-title">昨天</h3>
          <ul class="feed-list">
            <li class="feed-card">
              <div class="feed-card__head">
                <div class="feed-card__meta">
                  <span class="type-badge type-badge--video">视频</span>
                  <time class="feed-card__time">19:20</time>
                </div>
                <button type="button" class="more-btn" aria-label="更多">⋯</button>
              </div>
              <div class="feed-card__body">
                <div class="feed-card__media">
                  <div class="media-placeholder">视频封面</div>
                  <div class="play-overlay"><span class="play-overlay__btn">▶</span></div>
                  <span class="duration-tag">0:18</span>
                </div>
              </div>
            </li>
            <li class="feed-card">
              <div class="feed-card__head">
                <div class="feed-card__meta">
                  <span class="type-badge type-badge--voice">语音</span>
                  <time class="feed-card__time">08:15</time>
                </div>
                <button type="button" class="more-btn" aria-label="更多">⋯</button>
              </div>
              <div class="feed-card__body">
                <div class="voice-bar">
                  <button type="button" class="voice-bar__play">▶</button>
                  <div class="voice-bar__wave"></div>
                  <span class="voice-bar__dur">0:32</span>
                </div>
              </div>
            </li>
            <li class="feed-card">
              <div class="feed-card__head">
                <div class="feed-card__meta">
                  <span class="type-badge type-badge--text">文字</span>
                  <time class="feed-card__time">12:05</time>
                </div>
                <button type="button" class="more-btn" aria-label="更多">⋯</button>
              </div>
              <div class="feed-card__body">
                <p class="feed-card__text">午饭和同事聊了项目排期。</p>
              </div>
            </li>
          </ul>
        </section>
      </div>

      <nav class="tabbar" aria-label="主导航">
        <button type="button" class="tabbar__btn"><span class="tabbar__icon"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></span><span class="tabbar__label">消息</span></button>
        <button type="button" class="tabbar__btn"><span class="tabbar__icon"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-3-3.87"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg></span><span class="tabbar__label">群聊</span></button>
        <button type="button" class="tabbar__btn"><span class="tabbar__icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/></svg></span><span class="tabbar__label">朋友圈</span></button>
        <button type="button" class="tabbar__btn"><span class="tabbar__icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg></span><span class="tabbar__label">YiYi</span></button>
        <button type="button" class="tabbar__btn tabbar__btn--active"><span class="tabbar__icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M8 10h8"/><path d="M8 14h5"/></svg></span><span class="tabbar__label">日常</span></button>
        <button type="button" class="tabbar__btn"><span class="tabbar__icon"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span><span class="tabbar__label">我的</span></button>
      </nav>
    </div>
    <p class="pm-tag">发布区占用更多垂直空间，适合强调「先选类型再记录」。记录卡片可混排四种媒体形态。</p>
  </div>
</body>
</html>
