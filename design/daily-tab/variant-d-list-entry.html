<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>方案 D · 列表式入口</title>
  <link rel="stylesheet" href="_shared.css" />
  <style>
    .entry-list {
      margin: 12px 14px 0;
      background: var(--surface);
      border-radius: 16px;
      border: 0.5px solid var(--border);
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(20, 23, 26, 0.04);
    }
    .entry-row {
      width: 100%;
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      cursor: pointer;
      font-family: inherit;
      text-align: left;
    }
    .entry-row + .entry-row {
      border-top: 0.5px solid var(--border);
    }
    .entry-row__label {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .entry-row__title {
      font-size: 15px;
      font-weight: 600;
    }
    .entry-row__arr {
      font-size: 18px;
      color: #c4c8d0;
      font-weight: 300;
    }
    .section-divider {
      height: 8px;
      background: transparent;
    }
  </style>
</head>
<body>
  <a class="back-link" href="index.html">← 方案索引</a>
  <p class="mock-label">方案 D · 列表式入口（对齐朋友圈 Tab 风格）</p>
  <div class="phone-wrap">
    <div class="phone">
      <header class="tab-topbar">
        <h1 class="tab-topbar__title">日常</h1>
      </header>
      <div class="tab-scroll">
        <div class="entry-list" role="group" aria-label="发布">
          <button type="button" class="entry-row">
            <span class="entry-row__label">
              <span class="pub-icon pub-icon--photo" aria-hidden>📷</span>
              <span class="entry-row__title">拍照</span>
            </span>
            <span class="entry-row__arr" aria-hidden>›</span>
          </button>
          <button type="button" class="entry-row">
            <span class="entry-row__label">
              <span class="pub-icon pub-icon--video" aria-hidden>🎬</span>
              <span class="entry-row__title">拍视频</span>
            </span>
            <span class="entry-row__arr" aria-hidden>›</span>
          </button>
          <button type="button" class="entry-row">
            <span class="entry-row__label">
              <span class="pub-icon pub-icon--text" aria-hidden>✏️</span>
              <span class="entry-row__title">写文字</span>
            </span>
            <span class="entry-row__arr" aria-hidden>›</span>
          </button>
          <button type="button" class="entry-row">
            <span class="entry-row__label">
              <span class="pub-icon pub-icon--voice" aria-hidden>🎙</span>
              <span class="entry-row__title">语音</span>
            </span>
            <span class="entry-row__arr" aria-hidden>›</span>
          </button>
        </div>

        <div class="section-divider"></div>

        <section class="day-group" style="padding-top: 8px">
          <div class="section-head" style="padding-top: 0">
            <h2>我的记录</h2>
          </div>
          <h3 class="day-title">今天</h3>
          <ul class="feed-list">
            <li class="feed-card">
              <div class="feed-card__head">
                <div class="feed-card__meta">
                  <span class="type-badge type-badge--photo">照片</span>
                  <time class="feed-card__time">09:42</time>
                </div>
                <button type="button" class="more-btn" aria-label="更多">⋯</button>
              </div>
              <div class="feed-card__body">
                <p class="feed-card__text">晨跑后的早餐。</p>
                <div class="feed-card__media"><div class="media-placeholder">照片</div></div>
              </div>
            </li>
          </ul>
        </section>

        <section class="day-group">
          <h3 class="day-title">昨天</h3>
          <ul class="feed-list">
            <li class="feed-card">
              <div class="feed-card__head">
                <div class="feed-card__meta">
                  <span class="type-badge type-badge--text">文字</span>
                  <time class="feed-card__time">12:05</time>
                </div>
                <button type="button" class="more-btn" aria-label="更多">⋯</button>
              </div>
              <div class="feed-card__body">
                <p class="feed-card__text">午饭和同事聊了项目排期。</p>
              </div>
            </li>
          </ul>
        </section>
      </div>

      <nav class="tabbar" aria-label="主导航">
        <button type="button" class="tabbar__btn"><span class="tabbar__icon"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7"/></svg></span><span class="tabbar__label">消息</span></button>
        <button type="button" class="tabbar__btn"><span class="tabbar__icon"><svg viewBox="0 0 24 24"><circle cx="9" cy="7" r="4"/></svg></span><span class="tabbar__label">群聊</span></button>
        <button type="button" class="tabbar__btn"><span class="tabbar__icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg></span><span class="tabbar__label">朋友圈</span></button>
        <button type="button" class="tabbar__btn"><span class="tabbar__icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg></span><span class="tabbar__label">YiYi</span></button>
        <button type="button" class="tabbar__btn tabbar__btn--active"><span class="tabbar__icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="3"/></svg></span><span class="tabbar__label">日常</span></button>
        <button type="button" class="tabbar__btn"><span class="tabbar__icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/></svg></span><span class="tabbar__label">我的</span></button>
      </nav>
    </div>
    <p class="pm-tag">与现有「朋友圈」Tab 入口列表（探索好友 / 我的动态 / 热点）视觉一致，学习成本最低。</p>
  </div>
</body>
</html>
