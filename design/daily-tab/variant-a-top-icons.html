<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>方案 A · 顶部四图标横排</title>
  <link rel="stylesheet" href="_shared.css" />
  <style>
    .publish-strip {
      margin: 12px 14px 0;
      padding: 16px 12px;
      background: var(--surface);
      border-radius: 18px;
      border: 0.5px solid var(--border);
      box-shadow: 0 4px 16px rgba(20, 23, 26, 0.05);
    }
    .publish-strip__row {
      display: flex;
      justify-content: space-between;
      gap: 4px;
    }
    .publish-btn {
      flex: 1;
      border: none;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
      cursor: pointer;
      font-family: inherit;
    }
    .publish-btn__label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
    }
  </style>
</head>
<body>
  <a class="back-link" href="index.html">← 方案索引</a>
  <p class="mock-label">方案 A · 顶部四图标横排</p>
  <div class="phone-wrap">
    <div class="phone">
      <header class="tab-topbar">
        <h1 class="tab-topbar__title">日常</h1>
      </header>
      <div class="tab-scroll">
        <div class="publish-strip" role="group" aria-label="发布">
          <div class="publish-strip__row">
            <button type="button" class="publish-btn">
              <span class="pub-icon pub-icon--photo" aria-hidden>📷</span>
              <span class="publish-btn__label">拍照</span>
            </button>
            <button type="button" class="publish-btn">
              <span class="pub-icon pub-icon--video" aria-hidden>🎬</span>
              <span class="publish-btn__label">拍视频</span>
            </button>
            <button type="button" class="publish-btn">
              <span class="pub-icon pub-icon--text" aria-hidden>✏️</span>
              <span class="publish-btn__label">写文字</span>
            </button>
            <button type="button" class="publish-btn">
              <span class="pub-icon pub-icon--voice" aria-hidden>🎙</span>
              <span class="publish-btn__label">语音</span>
            </button>
          </div>
        </div>

        <div class="section-head">
          <h2>我的记录</h2>
          <span>共 12 条</span>
        </div>

        <section class="day-group">
          <h3 class="day-title">今天</h3>
          <ul class="feed-list">
            <li class="feed-card">
              <div class="feed-card__head">
                <div class="feed-card__meta">
                  <span class="type-badge type-badge--photo">照片</span>
                  <time class="feed-card__time">09:42</time>
                </div>
                <button type="button" class="more-btn" aria-label="更多">⋯</button>
              </div>
              <div class="feed-card__body">
                <p class="feed-card__text">晨跑后的早餐，今天状态不错。</p>
                <div class="feed-card__media">
                  <div class="media-placeholder">照片预览</div>
                </div>
              </div>
            </li>
            <li class="feed-card">
              <div class="feed-card__head">
                <div class="feed-card__meta">
                  <span class="type-badge type-badge--voice">语音</span>
                  <time class="feed-card__time">08:15</time>
                </div>
                <button type="button" class="more-btn" aria-label="更多">⋯</button>
              </div>
              <div class="feed-card__body">
                <div class="voice-bar">
                  <button type="button" class="voice-bar__play" aria-label="播放">▶</button>
                  <div class="voice-bar__wave" aria-hidden></div>
                  <span class="voice-bar__dur">0:32</span>
                </div>
              </div>
            </li>
          </ul>
        </section>

        <section class="day-group">
          <h3 class="day-title">昨天</h3>
          <ul class="feed-list">
            <li class="feed-card">
              <div class="feed-card__head">
                <div class="feed-card__meta">
                  <span class="type-badge type-badge--video">视频</span>
                  <time class="feed-card__time">19:20</time>
                </div>
                <button type="button" class="more-btn" aria-label="更多">⋯</button>
              </div>
              <div class="feed-card__body">
                <p class="feed-card__text">下班路上的晚霞。</p>
                <div class="feed-card__media">
                  <div class="media-placeholder">视频封面</div>
                  <div class="play-overlay">
                    <span class="play-overlay__btn">▶</span>
                  </div>
                  <span class="duration-tag">0:18</span>
                </div>
              </div>
            </li>
            <li class="feed-card">
              <div class="feed-card__head">
                <div class="feed-card__meta">
                  <span class="type-badge type-badge--text">文字</span>
                  <time class="feed-card__time">12:05</time>
                </div>
                <button type="button" class="more-btn" aria-label="更多">⋯</button>
              </div>
              <div class="feed-card__body">
                <p class="feed-card__text">午饭和同事聊了项目排期，下午要把接口文档补全。</p>
              </div>
            </li>
          </ul>
        </section>
      </div>

      <nav class="tabbar" aria-label="主导航">
        <button type="button" class="tabbar__btn"><span class="tabbar__icon"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></span><span class="tabbar__label">消息</span></button>
        <button type="button" class="tabbar__btn"><span class="tabbar__icon"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-3-3.87"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg></span><span class="tabbar__label">群聊</span></button>
        <button type="button" class="tabbar__btn"><span class="tabbar__icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg></span><span class="tabbar__label">朋友圈</span></button>
        <button type="button" class="tabbar__btn"><span class="tabbar__icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v2"/><path d="M12 15v2"/></svg></span><span class="tabbar__label">YiYi</span></button>
        <button type="button" class="tabbar__btn tabbar__btn--active"><span class="tabbar__icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M8 10h8"/><path d="M8 14h5"/></svg></span><span class="tabbar__label">日常</span></button>
        <button type="button" class="tabbar__btn"><span class="tabbar__icon"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span><span class="tabbar__label">我的</span></button>
      </nav>
    </div>
    <p class="pm-tag">推荐主方案：发布区固定在顶部，记录按日分组向下滚动。四入口等宽，图标 + 短标签，与产品现有卡片风格一致。</p>
  </div>
</body>
</html>
