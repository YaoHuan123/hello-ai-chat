<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>方案 C · 底部发布 Dock</title>
  <link rel="stylesheet" href="_shared.css" />
  <style>
    .tab-scroll {
      padding-bottom: calc(var(--tabbar-h) + 72px + var(--safe-bottom));
    }
    .publish-dock {
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(var(--tabbar-h) + var(--safe-bottom));
      padding: 10px 14px 12px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(16px);
      border-top: 0.5px solid var(--border);
      display: flex;
      justify-content: space-between;
      gap: 6px;
      z-index: 2;
    }
    .dock-btn {
      flex: 1;
      border: none;
      background: var(--bg);
      border-radius: 14px;
      padding: 10px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      font-family: inherit;
    }
    .dock-btn .pub-icon {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      font-size: 18px;
    }
    .dock-btn__label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text);
    }
    .feed-row {
      display: flex;
      gap: 12px;
      padding: 14px 16px;
      background: var(--surface);
      border-radius: 16px;
      border: 0.5px solid var(--border);
    }
    .feed-row__time {
      flex-shrink: 0;
      width: 42px;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      padding-top: 2px;
    }
    .feed-row__main { flex: 1; min-width: 0; }
    .feed-row__main .feed-card__text { font-size: 14px; }
    .feed-row__thumb {
      width: 72px;
      height: 72px;
      border-radius: 10px;
      background: #e5e7eb;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <a class="back-link" href="index.html">← 方案索引</a>
  <p class="mock-label">方案 C · 底部发布 Dock</p>
  <div class="phone-wrap">
    <div class="phone">
      <header class="tab-topbar">
        <h1 class="tab-topbar__title">日常</h1>
      </header>
      <div class="tab-scroll">
        <div class="section-head">
          <h2>我的记录</h2>
          <span>共 12 条</span>
        </div>

        <section class="day-group">
          <h3 class="day-title">今天</h3>
          <ul class="feed-list">
            <li class="feed-row">
              <time class="feed-row__time">09:42</time>
              <div class="feed-row__main">
                <span class="type-badge type-badge--photo">照片</span>
                <p class="feed-card__text" style="margin-top:6px">晨跑后的早餐，今天状态不错。</p>
              </div>
              <div class="feed-row__thumb">图</div>
            </li>
            <li class="feed-row">
              <time class="feed-row__time">08:15</time>
              <div class="feed-row__main">
                <span class="type-badge type-badge--voice">语音</span>
                <div class="voice-bar" style="margin-top:8px">
                  <button type="button" class="voice-bar__play">▶</button>
                  <div class="voice-bar__wave"></div>
                  <span class="voice-bar__dur">0:32</span>
                </div>
              </div>
            </li>
          </ul>
        </section>

        <section class="day-group">
          <h3 class="day-title">昨天</h3>
          <ul class="feed-list">
            <li class="feed-row">
              <time class="feed-row__time">19:20</time>
              <div class="feed-row__main">
                <span class="type-badge type-badge--video">视频</span>
                <p class="feed-card__text" style="margin-top:6px">下班路上的晚霞。</p>
              </div>
              <div class="feed-row__thumb">▶</div>
            </li>
            <li class="feed-row">
              <time class="feed-row__time">12:05</time>
              <div class="feed-row__main">
                <span class="type-badge type-badge--text">文字</span>
                <p class="feed-card__text" style="margin-top:6px">午饭和同事聊了项目排期。</p>
              </div>
            </li>
          </ul>
        </section>
      </div>

      <div class="publish-dock" role="group" aria-label="发布">
        <button type="button" class="dock-btn">
          <span class="pub-icon pub-icon--photo">📷</span>
          <span class="dock-btn__label">拍照</span>
        </button>
        <button type="button" class="dock-btn">
          <span class="pub-icon pub-icon--video">🎬</span>
          <span class="dock-btn__label">拍视频</span>
        </button>
        <button type="button" class="dock-btn">
          <span class="pub-icon pub-icon--text">✏️</span>
          <span class="dock-btn__label">写文字</span>
        </button>
        <button type="button" class="dock-btn">
          <span class="pub-icon pub-icon--voice">🎙</span>
          <span class="dock-btn__label">语音</span>
        </button>
      </div>

      <nav class="tabbar" aria-label="主导航">
        <button type="button" class="tabbar__btn"><span class="tabbar__icon"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7"/></svg></span><span class="tabbar__label">消息</span></button>
        <button type="button" class="tabbar__btn"><span class="tabbar__icon"><svg viewBox="0 0 24 24"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg></span><span class="tabbar__label">群聊</span></button>
        <button type="button" class="tabbar__btn"><span class="tabbar__icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg></span><span class="tabbar__label">朋友圈</span></button>
        <button type="button" class="tabbar__btn"><span class="tabbar__icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg></span><span class="tabbar__label">YiYi</span></button>
        <button type="button" class="tabbar__btn tabbar__btn--active"><span class="tabbar__icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M8 10h8"/></svg></span><span class="tabbar__label">日常</span></button>
        <button type="button" class="tabbar__btn"><span class="tabbar__icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/></svg></span><span class="tabbar__label">我的</span></button>
      </nav>
    </div>
    <p class="pm-tag">记录流全屏展示，发布 Dock 固定在 Tab 栏上方，拇指可达。适合记录多、发布频繁的场景。</p>
  </div>
</body>
</html>
