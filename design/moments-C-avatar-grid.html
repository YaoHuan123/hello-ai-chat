<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>方案 C · 头像宫格速选</title>
    <style>
      :root {
        --bg: #f2f3f7; --surface: #fff; --text: #14171a; --muted: #6b7380;
        --border: rgba(20,23,26,0.08); --accent: #d49a3a; --accent-soft: rgba(212,154,58,0.14);
        --shadow: 0 6px 22px rgba(20,23,26,0.08);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #e9ebf1; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--text); }
      body { display: flex; align-items: center; justify-content: center; padding: 24px; gap: 28px; flex-wrap: wrap; }
      .phone { width: 390px; height: 844px; background: var(--bg); border-radius: 40px; overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--border); display: flex; flex-direction: column; }
      .note { max-width: 300px; font-size: 13px; line-height: 1.65; color: #6b7380; }
      .note h2 { font-size: 15px; color: #14171a; margin: 0 0 8px; }
      .note a { color: #d49a3a; }
      .hero { padding: 48px 20px 20px; text-align: center; background: linear-gradient(180deg, rgba(212,154,58,0.12) 0%, var(--bg) 100%); }
      .hero h1 { margin: 0; font-size: 24px; font-weight: 800; }
      .hero p { margin: 10px auto 0; max-width: 280px; font-size: 14px; color: var(--muted); line-height: 1.55; }
      .pill { display: inline-flex; margin-top: 14px; padding: 6px 14px; border-radius: 999px; background: var(--surface); border: 0.5px solid var(--border); font-size: 12px; color: #7a5a1a; }
      .search { margin: 0 16px 12px; padding: 10px 14px; border-radius: 12px; border: 0.5px solid var(--border); background: var(--surface); font-size: 14px; color: var(--muted); }
      .scroll { flex: 1; overflow-y: auto; padding: 0 16px 12px; }
      .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px 12px; }
      .cell { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
      .av-wrap { position: relative; }
      .av { width: 72px; height: 72px; border-radius: 20px; background: linear-gradient(135deg, #f0b35c, #e88b3a); color: #fff; font-weight: 800; font-size: 26px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(212,154,58,0.25); }
      .dot { position: absolute; top: -2px; right: -2px; width: 14px; height: 14px; border-radius: 50%; background: #2dc69b; border: 2px solid var(--bg); }
      .nm { font-size: 13px; font-weight: 600; text-align: center; max-width: 88px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tabbar { display: flex; border-top: 0.5px solid var(--border); background: var(--surface); padding: 10px 0 24px; }
      .tab { flex: 1; text-align: center; font-size: 11px; font-weight: 600; color: var(--muted); }
      .tab.on { color: var(--accent); }
    </style>
  </head>
  <body>
    <div class="phone">
      <div class="hero">
        <h1>探索好友日常</h1>
        <p>选一位好友，和 TA 的日常分身聊聊。单向、私密，对方不会知道。</p>
        <div class="pill">🔒 仅你可见</div>
      </div>
      <div class="search">搜索好友</div>
      <div class="scroll">
        <div class="grid">
          <div class="cell"><div class="av-wrap"><div class="av">小</div><span class="dot"></span></div><span class="nm">小雨</span></div>
          <div class="cell"><div class="av-wrap"><div class="av" style="background:linear-gradient(135deg,#6e88ff,#9ab0ff)">阿</div><span class="dot"></span></div><span class="nm">阿Ken</span></div>
          <div class="cell"><div class="av-wrap"><div class="av" style="background:linear-gradient(135deg,#2dc69b,#7fe7c4)">L</div></div><span class="nm">Lisa</span></div>
          <div class="cell"><div class="av-wrap"><div class="av" style="background:linear-gradient(135deg,#e8789a,#f5b0c8)">薇</div><span class="dot"></span></div><span class="nm">薇薇</span></div>
          <div class="cell"><div class="av-wrap"><div class="av" style="background:linear-gradient(135deg,#8b7cf6,#c4b8ff)">陈</div></div><span class="nm">陈同学</span></div>
          <div class="cell"><div class="av-wrap"><div class="av" style="background:linear-gradient(135deg,#5c9ce8,#9ec8f5)">7</div></div><span class="nm">138****8821</span></div>
        </div>
      </div>
      <nav class="tabbar">
        <div class="tab">消息</div>
        <div class="tab on">朋友圈</div>
        <div class="tab">AI</div>
        <div class="tab">联系人</div>
        <div class="tab">我的</div>
      </nav>
    </div>
    <aside class="note">
      <h2>方案 C · 头像宫格</h2>
      <p>弱化列表感，强化<b>「选人」</b>。绿点表示 TA 有已同步的日常内容。点击进入探索聊天。</p>
      <p><b>适合</b>好友数量适中（&lt;30）；与通讯录差异化明显。</p>
      <p><a href="./moments-index.html">← 返回索引</a></p>
    </aside>
  </body>
</html>
