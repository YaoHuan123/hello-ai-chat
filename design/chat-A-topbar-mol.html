<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>方案 A · 顶栏 Mol 切换 + 工具条</title>
    <style>
      :root {
        --bg: #f2f3f7;
        --surface: #ffffff;
        --text: #14171a;
        --muted: #6b7380;
        --border: rgba(20, 23, 26, 0.08);
        --accent: #4f6df5;
        --accent-soft: rgba(79, 109, 245, 0.12);
        --bubble-me: #4f6df5;
        --bubble-other: #ffffff;
        --shadow: 0 6px 22px rgba(20, 23, 26, 0.08);
        --radius-lg: 16px;
        --radius-pill: 999px;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #e9ebf1; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--text); }
      body { display: flex; align-items: center; justify-content: center; padding: 24px; }
      .phone {
        width: 390px; height: 800px; background: var(--bg); border-radius: 40px; overflow: hidden;
        position: relative; box-shadow: var(--shadow); border: 1px solid var(--border);
        display: flex; flex-direction: column;
      }
      header.topbar {
        background: var(--surface); display: flex; align-items: center; gap: 10px;
        padding: 14px 14px 10px; border-bottom: 0.5px solid var(--border); flex-shrink: 0;
      }
      .icon-btn {
        width: 36px; height: 36px; border-radius: 50%; border: none; background: transparent;
        display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
        color: var(--text); font-size: 18px;
      }
      .icon-btn:hover { background: var(--accent-soft); }
      .peer { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
      .avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #6e88ff, #b6c3ff); color: #fff; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
      .peer-meta { min-width: 0; line-height: 1.2; }
      .peer-name { font-weight: 700; font-size: 16px; }
      .peer-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
      .mode-toggle {
        font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: var(--radius-pill);
        background: var(--accent-soft); color: var(--accent); border: none; cursor: pointer;
      }

      .mol-bar {
        background: var(--surface); padding: 8px 12px; display: flex; align-items: center; gap: 8px;
        border-bottom: 0.5px solid var(--border); flex-shrink: 0;
      }
      .mol-pill {
        flex: 1; display: flex; align-items: center; gap: 8px; padding: 8px 12px;
        background: var(--accent-soft); border-radius: var(--radius-pill); cursor: pointer; border: none;
        text-align: left;
      }
      .mol-pill__dot { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 10px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
      .mol-pill__label { font-size: 11px; color: var(--muted); }
      .mol-pill__name { font-size: 14px; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 4px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .mol-pill__chev { color: var(--accent); opacity: 0.7; font-size: 12px; }
      .btn-mol-suggest {
        flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px;
        border-radius: var(--radius-pill); background: var(--accent); color: #fff; border: none;
        font-size: 13px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(79, 109, 245, 0.32);
      }
      .btn-mol-suggest .spark { font-size: 14px; }

      .scroll {
        flex: 1; overflow-y: auto; padding: 16px 14px 12px;
        display: flex; flex-direction: column; gap: 14px;
      }
      .time-divider { align-self: center; font-size: 11px; color: var(--muted); padding: 4px 10px; background: rgba(0,0,0,0.04); border-radius: 999px; }
      .row { display: flex; align-items: flex-end; gap: 8px; }
      .row--me { flex-direction: row-reverse; }
      .row .avatar { width: 28px; height: 28px; font-size: 12px; }
      .row .avatar.me { background: linear-gradient(135deg, #2dc69b, #7fe7c4); }
      .col { display: flex; flex-direction: column; max-width: 75%; gap: 4px; }
      .row--me .col { align-items: flex-end; }
      .meta { font-size: 11px; color: var(--muted); }
      .bubble { padding: 10px 14px; border-radius: var(--radius-lg); font-size: 15px; line-height: 1.45; word-break: break-word; box-shadow: var(--shadow); }
      .bubble--other { background: var(--bubble-other); border-bottom-left-radius: 6px; }
      .bubble--me { background: var(--bubble-me); color: #fff; border-bottom-right-radius: 6px; }

      .suggest-panel {
        position: absolute; left: 12px; right: 12px; bottom: calc(82px + env(safe-area-inset-bottom));
        background: var(--surface); border-radius: 18px; padding: 14px 14px 12px;
        box-shadow: 0 14px 34px rgba(20, 23, 26, 0.18); border: 0.5px solid var(--border);
        z-index: 5;
      }
      .suggest-panel__head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
      .suggest-panel__title { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; }
      .suggest-panel__tag { font-size: 11px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 999px; }
      .suggest-panel__actions { display: flex; gap: 6px; }
      .ghost-btn { font-size: 12px; padding: 6px 10px; border-radius: 8px; background: rgba(0,0,0,0.04); border: none; cursor: pointer; }
      .suggest-list { display: flex; flex-direction: column; gap: 8px; }
      .suggest-item { width: 100%; text-align: left; padding: 10px 12px; border-radius: 12px; background: var(--accent-soft); border: 1px solid transparent; font-size: 14px; line-height: 1.45; color: var(--text); cursor: pointer; }
      .suggest-item:hover { border-color: var(--accent); }

      .composer {
        flex-shrink: 0; background: var(--surface); border-top: 0.5px solid var(--border);
        padding: 10px 12px calc(14px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 8px;
      }
      .input {
        flex: 1; height: 40px; border-radius: 20px; border: 1px solid var(--border);
        background: #f5f6f8; padding: 0 14px; font-size: 15px; color: var(--text); outline: none;
      }
      .input:focus { border-color: var(--accent); background: #fff; }
      .send {
        flex-shrink: 0; height: 40px; padding: 0 18px; border-radius: var(--radius-pill);
        background: var(--accent); color: #fff; border: none; font-weight: 700; font-size: 14px; cursor: pointer;
      }

      .caption { position: absolute; top: -22px; left: 0; right: 0; text-align: center; font-size: 12px; color: #6b7380; }
    </style>
  </head>
  <body>
    <div style="position: relative;">
      <div class="caption">方案 A · 顶栏显示 Mol，工具条放一键推荐</div>
      <div class="phone">
        <header class="topbar">
          <button class="icon-btn" aria-label="返回">‹</button>
          <div class="peer">
            <div class="avatar">王</div>
            <div class="peer-meta">
              <div class="peer-name">王晓明</div>
              <div class="peer-sub">在线 · 最近活跃 2 分钟前</div>
            </div>
          </div>
          <button class="mode-toggle" title="切换到单向模式">普通</button>
          <button class="icon-btn" aria-label="更多">⋯</button>
        </header>

        <div class="mol-bar">
          <button class="mol-pill" title="切换 Mol">
            <span class="mol-pill__dot">M</span>
            <span style="min-width: 0;">
              <span class="mol-pill__label">当前 Mol</span>
              <span class="mol-pill__name">职场沟通专家 <span class="mol-pill__chev">▾</span></span>
            </span>
          </button>
          <button class="btn-mol-suggest"><span class="spark">✨</span> Mol 推荐</button>
        </div>

        <div class="scroll">
          <div class="time-divider">今天 14:32</div>

          <div class="row">
            <div class="avatar">王</div>
            <div class="col">
              <div class="bubble bubble--other">这周的需求评审看下来还有几个点想确认下，方便对一下进度吗？</div>
              <div class="meta">14:32</div>
            </div>
          </div>

          <div class="row row--me">
            <div class="avatar me">我</div>
            <div class="col">
              <div class="bubble bubble--me">下午 3 点之前都可以，文档我先理一遍发你。</div>
              <div class="meta">14:34</div>
            </div>
          </div>

          <div class="row">
            <div class="avatar">王</div>
            <div class="col">
              <div class="bubble bubble--other">那就 15:00 拉个 30 分钟的短会，我把同事也叫上。</div>
              <div class="meta">14:35</div>
            </div>
          </div>
        </div>

        <div class="suggest-panel" aria-label="Mol 建议">
          <div class="suggest-panel__head">
            <div class="suggest-panel__title">
              <span>Mol 建议</span>
              <span class="suggest-panel__tag">职场沟通专家</span>
            </div>
            <div class="suggest-panel__actions">
              <button class="ghost-btn">刷新</button>
              <button class="ghost-btn">关闭</button>
            </div>
          </div>
          <div class="suggest-list">
            <button class="suggest-item">好的，15:00 准时连线，我提前 5 分钟把会议链接发到群里。</button>
            <button class="suggest-item">可以，我把评审纪要先发你，会上我们直接过未决项。</button>
            <button class="suggest-item">没问题，把参会同事一起拉进来更高效。</button>
          </div>
        </div>

        <div class="composer">
          <input class="input" placeholder="输入消息" />
          <button class="send">发送</button>
        </div>
      </div>
    </div>
  </body>
</html>
