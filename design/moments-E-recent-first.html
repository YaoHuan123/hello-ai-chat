<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>方案 E · 最近探索 + 全部好友</title>
    <style>
      :root {
        --bg: #f2f3f7; --surface: #fff; --text: #14171a; --muted: #6b7380;
        --border: rgba(20,23,26,0.08); --accent: #d49a3a; --accent-soft: rgba(212,154,58,0.14);
        --shadow: 0 6px 22px rgba(20,23,26,0.08);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #e9ebf1; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--text); }
      body { display: flex; align-items: center; justify-content: center; padding: 24px; gap: 28px; flex-wrap: wrap; }
      .phone { width: 390px; height: 844px; background: var(--bg); border-radius: 40px; overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--border); display: flex; flex-direction: column; }
      .note { max-width: 300px; font-size: 13px; line-height: 1.65; color: #6b7380; }
      .note h2 { font-size: 15px; color: #14171a; margin: 0 0 8px; }
      .note a { color: #d49a3a; }
      header.top { background: var(--surface); padding: 52px 18px 12px; border-bottom: 0.5px solid var(--border); }
      header.top h1 { margin: 0; font-size: 22px; }
      .scroll { flex: 1; overflow-y: auto; }
      .sec { padding: 14px 0 6px; }
      .sec-h { padding: 0 16px 10px; font-size: 13px; font-weight: 700; color: var(--muted); text-transform: none; letter-spacing: 0.02em; }
      .hscroll { display: flex; gap: 10px; overflow-x: auto; padding: 0 16px 8px; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
      .hscroll::-webkit-scrollbar { display: none; }
      .rcard { flex: 0 0 200px; scroll-snap-align: start; background: var(--surface); border-radius: 16px; padding: 14px; border: 0.5px solid var(--border); }
      .rcard .av { width: 40px; height: 40px; border-radius: 11px; background: linear-gradient(135deg, #f0b35c, #e88b3a); color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
      .rcard .n { font-size: 15px; font-weight: 700; }
      .rcard .preview { margin-top: 8px; font-size: 12px; color: var(--muted); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
      .rcard .go { margin-top: 10px; font-size: 12px; font-weight: 700; color: var(--accent); }
      .list { padding: 0 14px 12px; }
      .row { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--surface); border-radius: 14px; margin-bottom: 6px; border: 0.5px solid var(--border); }
      .row .av { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #6e88ff, #9ab0ff); color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
      .row .mid { flex: 1; min-width: 0; }
      .row .n { font-size: 15px; font-weight: 600; }
      .row .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
      .row .arr { color: var(--muted); font-size: 20px; }
      .tabbar { display: flex; border-top: 0.5px solid var(--border); background: var(--surface); padding: 10px 0 24px; }
      .tab { flex: 1; text-align: center; font-size: 11px; font-weight: 600; color: var(--muted); }
      .tab.on { color: var(--accent); }
    </style>
  </head>
  <body>
    <div class="phone">
      <header class="top"><h1>朋友圈</h1></header>
      <div class="scroll">
        <section class="sec">
          <div class="sec-h">最近在探索</div>
          <div class="hscroll">
            <div class="rcard">
              <div class="av">小</div>
              <div class="n">小雨</div>
              <div class="preview">你：那家咖啡馆叫什么名字？<br />分身：小雨提的是城西那家，拿铁她觉得特别好喝…</div>
              <div class="go">继续聊 ›</div>
            </div>
            <div class="rcard">
              <div class="av" style="background:linear-gradient(135deg,#e8789a,#f5b0c8)">薇</div>
              <div class="n">薇薇</div>
              <div class="preview">你：她最近忙什么？<br />分身：她动态里提到在准备跳槽，压力有点大…</div>
              <div class="go">继续聊 ›</div>
            </div>
          </div>
        </section>
        <section class="sec">
          <div class="sec-h">全部好友</div>
          <div class="list">
            <div class="row">
              <div class="av">阿</div>
              <div class="mid"><div class="n">阿Ken</div><div class="s">1 条话题 · 和分身聊聊</div></div>
              <span class="arr">›</span>
            </div>
            <div class="row">
              <div class="av" style="background:linear-gradient(135deg,#2dc69b,#7fe7c4)">L</div>
              <div class="mid"><div class="n">Lisa</div><div class="s">2 条动态 · 和分身聊聊</div></div>
              <span class="arr">›</span>
            </div>
            <div class="row">
              <div class="av" style="background:linear-gradient(135deg,#5c9ce8,#9ec8f5)">7</div>
              <div class="mid"><div class="n">138****8821</div><div class="s">暂无动态</div></div>
              <span class="arr">›</span>
            </div>
          </div>
        </section>
      </div>
      <nav class="tabbar">
        <div class="tab">消息</div>
        <div class="tab on">朋友圈</div>
        <div class="tab">AI</div>
        <div class="tab">联系人</div>
        <div class="tab">我的</div>
      </nav>
    </div>
    <aside class="note">
      <h2>方案 E · 最近 + 全部</h2>
      <p>上半区服务<b>回访</b>（带探索对话摘要），下半区服务<b>发现新好友</b>。新用户上半区可显示引导卡片。</p>
      <p><b>注意：</b>探索摘要仅自己可见，文案要避免像「偷看聊天记录」。</p>
      <p><a href="./moments-index.html">← 返回索引</a></p>
    </aside>
  </body>
</html>
