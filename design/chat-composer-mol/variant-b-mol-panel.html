<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>方案 B+ · 点击 Mol 后的输入面板</title>
  <link rel="stylesheet" href="_shared.css" />
  <style>
    .phone-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .dock {
      flex-shrink: 0;
      background: var(--surface);
      border-top: 0.5px solid var(--border);
      padding-bottom: calc(8px + var(--safe-bottom));
    }

    /* —— Mol 展开面板 —— */
    .mol-panel {
      border-bottom: 0.5px solid var(--border);
      animation: slideUp 0.22s ease-out;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .mol-panel-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px 8px;
    }
    .mol-panel-icon {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: linear-gradient(135deg, #7b61ff, #007aff);
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .mol-panel-meta { flex: 1; min-width: 0; }
    .mol-panel-name { font-size: 15px; font-weight: 700; }
    .mol-panel-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .mol-panel-actions { display: flex; gap: 4px; flex-shrink: 0; }
    .mol-panel-actions button {
      border: none;
      background: none;
      color: var(--accent);
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      padding: 6px 8px;
      cursor: pointer;
      border-radius: 8px;
    }
    .mol-panel-actions button:active { background: var(--accent-soft); }

    .mol-quick {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 0 14px 10px;
      scroll-snap-type: x mandatory;
    }
    .mol-quick::-webkit-scrollbar { display: none; }
    .mol-quick-chip {
      flex: 0 0 72%;
      max-width: 260px;
      scroll-snap-align: start;
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #f8f9fc;
      font-size: 12px;
      line-height: 1.35;
      text-align: left;
      font-family: inherit;
      cursor: pointer;
      color: var(--text);
    }
    .mol-quick-chip:active { background: var(--accent-soft); }

    .mol-list {
      padding: 0 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .mol-item {
      display: flex;
      align-items: stretch;
      gap: 10px;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: #fafbfe;
    }
    .mol-item-index {
      width: 24px;
      height: 24px;
      border-radius: 8px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .mol-item-body { flex: 1; min-width: 0; }
    .mol-item-text {
      font-size: 14px;
      line-height: 1.5;
      color: var(--text);
    }
    .mol-item-btns {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
      justify-content: center;
    }
    .mol-item-btns button {
      min-width: 52px;
      height: 30px;
      border-radius: 8px;
      border: none;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }
    .btn-edit {
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border) !important;
    }
    .btn-send {
      background: var(--accent);
      color: #fff;
    }

    .mol-panel-foot {
      padding: 0 12px 12px;
    }
    .mol-refresh {
      width: 100%;
      height: 38px;
      border-radius: 12px;
      border: 1px dashed rgba(0, 122, 255, 0.35);
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }
    .mol-refresh:disabled { opacity: 0.5; cursor: wait; }

    .mol-status {
      padding: 20px 16px 16px;
      text-align: center;
    }
    .mol-status p { font-size: 14px; color: var(--muted); margin-top: 8px; }
    .mol-skeleton {
      padding: 0 12px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .mol-skeleton-block {
      height: 64px;
      border-radius: 14px;
      background: linear-gradient(90deg, #eceef4 25%, #f5f6fa 50%, #eceef4 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .mol-empty-cta {
      margin: 8px 12px 12px;
      padding: 16px;
      border-radius: 14px;
      background: #f8f9fc;
      text-align: center;
    }
    .mol-empty-cta p { font-size: 14px; color: var(--muted); margin-bottom: 12px; }
    .mol-empty-cta button {
      height: 40px;
      padding: 0 20px;
      border: none;
      border-radius: 20px;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }

    .compose-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
    }
    .mol-btn {
      width: 40px;
      height: 40px;
      border-radius: 20px;
      border: none;
      background: linear-gradient(135deg, #7b61ff, #007aff);
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.25);
      position: relative;
    }
    .mol-btn[aria-pressed="true"]::after {
      content: "";
      position: absolute;
      inset: -3px;
      border-radius: 23px;
      border: 2px solid var(--accent);
      pointer-events: none;
    }

    /* —— 切换 Mol 底部 sheet —— */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 10;
      display: flex;
      align-items: flex-end;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .sheet {
      width: 100%;
      background: var(--surface);
      border-radius: 20px 20px 0 0;
      padding: 8px 16px calc(20px + var(--safe-bottom));
      animation: sheetUp 0.28s ease-out;
    }
    @keyframes sheetUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .sheet-handle {
      width: 36px;
      height: 4px;
      border-radius: 2px;
      background: rgba(0, 0, 0, 0.12);
      margin: 4px auto 16px;
    }
    .sheet-title {
      margin: 0 0 12px;
      font-size: 17px;
      font-weight: 600;
      text-align: center;
    }
    .sheet-list { list-style: none; display: flex; flex-direction: column; gap: 4px; }
    .sheet-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 10px;
      border: none;
      border-radius: 12px;
      background: transparent;
      font-family: inherit;
      text-align: left;
      cursor: pointer;
    }
    .sheet-item:active { background: #f2f2f7; }
    .sheet-item[aria-selected="true"] { background: var(--accent-soft); }
    .sheet-item-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #7b61ff, #007aff);
      color: #fff;
      font-weight: 800;
      display: grid;
      place-items: center;
    }
    .sheet-item-name { font-size: 15px; font-weight: 600; flex: 1; }
    .sheet-item-check { color: var(--accent); font-weight: 700; }

    .phone { position: relative; }

    .demo-bar {
      width: min(100%, var(--phone-w));
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
    }
    .demo-bar button {
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
    }
    .pm-tag {
      margin-top: 12px;
      width: min(100%, var(--phone-w));
      font-size: 12px;
      color: var(--muted);
      line-height: 1.55;
    }
    .toast {
      position: absolute;
      top: 56px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 23, 26, 0.82);
      color: #fff;
      font-size: 13px;
      padding: 8px 14px;
      border-radius: 20px;
      z-index: 20;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="phone-wrap">
    <p class="mock-label">方案 B+ · 点击 Mol 图标后展开完整面板（含切换 / 加载 / 空状态）</p>

    <div class="phone">
      <div id="toast" class="toast" role="status"></div>

      <header class="topbar">
        <button type="button" class="topbar-back">‹</button>
        <div class="topbar-av"></div>
        <div class="topbar-meta">
          <div class="topbar-name">张小北</div>
          <div class="topbar-sub">在线</div>
        </div>
      </header>

      <div class="messages">
        <div class="row row--me">
          <div class="av"></div>
          <div class="col">
            <div class="bubble bubble--me">好的，我这边还在改最后一版。</div>
            <span class="time">14:05</span>
          </div>
        </div>
        <div class="row">
          <div class="av"></div>
          <div class="col">
            <div class="bubble bubble--other">那今晚前能定稿吗？领导催得比较紧。</div>
            <span class="time">14:06</span>
          </div>
        </div>
      </div>

      <footer class="dock">
        <div id="molPanel" class="mol-panel hidden">
          <div class="mol-panel-head">
            <div class="mol-panel-icon">M</div>
            <div class="mol-panel-meta">
              <div class="mol-panel-name" id="molName">职场沟通</div>
              <div class="mol-panel-sub">基于最近对话</div>
            </div>
            <div class="mol-panel-actions">
              <button type="button" id="btnSwitch">切换</button>
              <button type="button" id="btnClose">收起</button>
            </div>
          </div>

          <div id="viewReady">
            <div class="mol-quick" id="molQuick"></div>
            <div class="mol-list" id="molList"></div>
            <div class="mol-panel-foot">
              <button type="button" class="mol-refresh" id="btnRefresh">重新生成</button>
            </div>
          </div>

          <div id="viewLoading" class="hidden">
            <div class="mol-skeleton">
              <div class="mol-skeleton-block"></div>
              <div class="mol-skeleton-block"></div>
              <div class="mol-skeleton-block"></div>
            </div>
          </div>

          <div id="viewError" class="mol-status hidden">
            <p style="color:#c44d72;font-weight:600;margin:0">生成失败</p>
            <p>请检查 Mol 资料或稍后重试</p>
            <button type="button" class="mol-refresh" id="btnRetry" style="margin-top:12px">重试</button>
          </div>

          <div id="viewEmpty" class="hidden">
            <div class="mol-empty-cta">
              <p>尚未添加 Mol，无法生成回复建议</p>
              <button type="button">去添加 Mol</button>
            </div>
          </div>
        </div>

        <div class="compose-row">
          <button type="button" class="mol-btn" id="btnMol" aria-pressed="false" aria-label="Mol">M</button>
          <input id="input" class="composer-input" type="text" placeholder="输入消息" />
          <button type="button" class="composer-send" id="btnSend">发送</button>
        </div>
      </footer>

      <div id="switchOverlay" class="overlay hidden" role="presentation">
        <div class="sheet" role="dialog" aria-labelledby="sheetTitle" onclick="event.stopPropagation()">
          <div class="sheet-handle" aria-hidden></div>
          <h2 id="sheetTitle" class="sheet-title">选择 Mol</h2>
          <ul class="sheet-list" id="molSheetList"></ul>
        </div>
      </div>
    </div>

    <div class="demo-bar" aria-label="原型状态预览">
      <button type="button" data-preview="ready">正常</button>
      <button type="button" data-preview="loading">加载中</button>
      <button type="button" data-preview="error">失败</button>
      <button type="button" data-preview="empty">未添加 Mol</button>
    </div>

    <p class="pm-tag">
      交互说明：点 M 展开面板 → 顶栏快捷条可横滑预览 → 下方列表支持「编辑」（填入输入框并收起）或「发送」（直接发出）。点「切换」打开 Mol 列表；再次点 M 或「收起」关闭面板。消息区不出现 Mol 气泡。
    </p>
  </div>

  <script>
    const SUGGESTIONS = [
      "收到，我今晚 8 点前发你终稿，有变动提前说。",
      "可以，我优先收尾这版，明早 9 点前同步一版给你确认。",
      "今晚有点紧，我先把核心页定稿，其余部分明天上午补上行吗？",
    ];

    const MOLS = [
      { id: "work", name: "职场沟通" },
      { id: "soft", name: "温和拒绝" },
      { id: "report", name: "高效汇报" },
    ];

    let activeMolId = "work";
    let panelOpen = false;
    let panelMode = "ready"; // ready | loading | error | empty

    const molPanel = document.getElementById("molPanel");
    const btnMol = document.getElementById("btnMol");
    const btnClose = document.getElementById("btnClose");
    const btnSwitch = document.getElementById("btnSwitch");
    const btnRefresh = document.getElementById("btnRefresh");
    const btnRetry = document.getElementById("btnRetry");
    const input = document.getElementById("input");
    const btnSend = document.getElementById("btnSend");
    const molName = document.getElementById("molName");
    const molQuick = document.getElementById("molQuick");
    const molList = document.getElementById("molList");
    const switchOverlay = document.getElementById("switchOverlay");
    const molSheetList = document.getElementById("molSheetList");
    const toast = document.getElementById("toast");

    const views = {
      ready: document.getElementById("viewReady"),
      loading: document.getElementById("viewLoading"),
      error: document.getElementById("viewError"),
      empty: document.getElementById("viewEmpty"),
    };

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1600);
    }

    function setPanelMode(mode) {
      panelMode = mode;
      Object.entries(views).forEach(([k, el]) => el.classList.toggle("hidden", k !== mode));
    }

    function renderSuggestions() {
      molQuick.innerHTML = "";
      molList.innerHTML = "";
      SUGGESTIONS.forEach((text, i) => {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "mol-quick-chip";
        chip.textContent = text;
        chip.addEventListener("click", () => adopt(text));
        molQuick.appendChild(chip);

        const row = document.createElement("div");
        row.className = "mol-item";
        row.innerHTML = `
          <span class="mol-item-index">${i + 1}</span>
          <div class="mol-item-body"><p class="mol-item-text"></p></div>
          <div class="mol-item-btns">
            <button type="button" class="btn-edit">编辑</button>
            <button type="button" class="btn-send">发送</button>
          </div>`;
        row.querySelector(".mol-item-text").textContent = text;
        row.querySelector(".btn-edit").addEventListener("click", () => adopt(text));
        row.querySelector(".btn-send").addEventListener("click", () => sendDirect(text));
        molList.appendChild(row);
      });
    }

    function renderMolSheet() {
      molSheetList.innerHTML = "";
      MOLS.forEach((m) => {
        const li = document.createElement("li");
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "sheet-item";
        btn.setAttribute("aria-selected", String(m.id === activeMolId));
        btn.innerHTML = `
          <span class="sheet-item-icon">M</span>
          <span class="sheet-item-name">${m.name}</span>
          ${m.id === activeMolId ? '<span class="sheet-item-check">✓</span>' : ""}`;
        btn.addEventListener("click", () => {
          activeMolId = m.id;
          molName.textContent = m.name;
          switchOverlay.classList.add("hidden");
          simulateLoad();
        });
        li.appendChild(btn);
        molSheetList.appendChild(li);
      });
    }

    function openPanel() {
      panelOpen = true;
      molPanel.classList.remove("hidden");
      btnMol.setAttribute("aria-pressed", "true");
      if (panelMode === "ready") simulateLoad(false);
    }

    function closePanel() {
      panelOpen = false;
      molPanel.classList.add("hidden");
      btnMol.setAttribute("aria-pressed", "false");
      switchOverlay.classList.add("hidden");
    }

    function togglePanel() {
      if (panelOpen) closePanel();
      else openPanel();
    }

    function adopt(text) {
      input.value = text;
      closePanel();
      input.focus();
      showToast("已填入输入框");
    }

    function sendDirect(text) {
      closePanel();
      showToast("已发送：" + text.slice(0, 14) + "…");
    }

    function simulateLoad(showSkeleton = true) {
      if (panelMode === "empty") return;
      if (showSkeleton) {
        setPanelMode("loading");
        btnRefresh.disabled = true;
      }
      setTimeout(() => {
        if (panelMode === "empty") return;
        renderSuggestions();
        setPanelMode("ready");
        btnRefresh.disabled = false;
      }, showSkeleton ? 700 : 0);
    }

    btnMol.addEventListener("click", togglePanel);
    btnClose.addEventListener("click", closePanel);
    btnSwitch.addEventListener("click", () => {
      renderMolSheet();
      switchOverlay.classList.remove("hidden");
    });
    switchOverlay.addEventListener("click", () => switchOverlay.classList.add("hidden"));

    btnRefresh.addEventListener("click", () => simulateLoad(true));
    btnRetry.addEventListener("click", () => simulateLoad(true));

    btnSend.addEventListener("click", () => {
      if (!input.value.trim()) return;
      showToast("消息已发送");
      input.value = "";
    });

    document.querySelectorAll("[data-preview]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const mode = btn.dataset.preview;
        openPanel();
        if (mode === "loading") {
          setPanelMode("loading");
        } else if (mode === "error") {
          setPanelMode("error");
        } else if (mode === "empty") {
          setPanelMode("empty");
        } else {
          setPanelMode("ready");
          renderSuggestions();
        }
      });
    });

    renderSuggestions();
    renderMolSheet();
  </script>
</body>
</html>
