<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>方案 C · 草稿气泡 · Mol 建议</title>
    <style>
      :root { --bg: #ededed; --surface: #fff; --text: #14171a; --muted: #6b7380; --border: rgba(20,23,26,0.1); --accent: #2f9e6f; --accent-soft: rgba(47,158,111,0.14); }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: #dfe3ea; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--text); }
      body { display: flex; align-items: center; justify-content: center; padding: 24px; gap: 28px; flex-wrap: wrap; }
      .phone { width: 390px; height: 844px; background: var(--bg); border-radius: 40px; overflow: hidden; box-shadow: 0 8px 28px rgba(20,23,26,0.14); display: flex; flex-direction: column; position: relative; }
      .note { max-width: 300px; font-size: 13px; line-height: 1.65; color: #6b7380; }
      .note h2 { font-size: 15px; margin: 0 0 8px; color: #14171a; }
      .note a { color: var(--accent); }
      .topbar { background: var(--surface); padding: 52px 16px 10px; border-bottom: 0.5px solid var(--border); }
      .topbar .name { font-size: 17px; font-weight: 600; }
      .chat { flex: 1; overflow-y: auto; padding: 12px 14px 100px; display: flex; flex-direction: column; gap: 10px; }
      .bubble.other { align-self: flex-start; max-width: 78%; padding: 10px 12px; border-radius: 12px 12px 12px 4px; background: var(--surface); border: 0.5px solid var(--border); font-size: 15px; line-height: 1.45; }
      .panel-c {
        align-self: flex-end; max-width: 92%; padding: 12px; border-radius: 16px 16px 4px 16px;
        border: 1.5px dashed var(--accent); background: var(--accent-soft);
      }
      .panel-c__head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 8px; }
      .panel-c__title { font-size: 13px; font-weight: 800; color: #1f6f4a; }
      .panel-c__actions { display: flex; gap: 6px; }
      .mini-btn { font-size: 11px; padding: 4px 8px; border-radius: 8px; background: rgba(255,255,255,0.85); border: 1px solid var(--border); font-weight: 600; cursor: pointer; font-family: inherit; }
      .panel-c__mol { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding-top: 8px; margin-bottom: 8px; border-top: 1px solid rgba(47,158,111,0.2); font-size: 11px; color: var(--muted); }
      .panel-c__mol button { border: none; background: none; color: var(--accent); font-weight: 700; font-size: 11px; cursor: pointer; font-family: inherit; }
      .panel-c__list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
      .panel-c__item {
        text-align: left; width: 100%; padding: 10px 11px; border-radius: 12px;
        background: rgba(255,255,255,0.92); border: 0.5px solid rgba(47,158,111,0.25);
        font-size: 14px; line-height: 1.45; cursor: pointer; font-family: inherit;
      }
      .composer { padding: 10px 12px 28px; background: #f7f7f7; border-top: 0.5px solid var(--border); display: flex; gap: 8px; }
      .composer input { flex: 1; border: 0.5px solid var(--border); border-radius: 8px; padding: 10px; background: var(--surface); }
      .composer .send { border: none; background: var(--accent); color: #fff; font-weight: 700; padding: 10px 14px; border-radius: 8px; }
    </style>
  </head>
  <body>
    <div class="phone">
      <header class="topbar"><span class="name">张经理</span></header>
      <div class="chat">
        <div class="bubble other">本周对接进度能同步一下吗？</div>
        <div class="panel-c" role="region" aria-label="Mol 建议">
          <div class="panel-c__head">
            <span class="panel-c__title">Mol 建议</span>
            <div class="panel-c__actions">
              <button type="button" class="mini-btn">刷新</button>
              <button type="button" class="mini-btn">关闭</button>
            </div>
          </div>
          <div class="panel-c__mol">
            <span>建议基于「我的 Mol」中的资料</span>
            <button type="button">修改 Mol</button>
          </div>
          <ul class="panel-c__list">
            <li><button type="button" class="panel-c__item">您好，关于本次对接的相关事项，我想和您沟通一下具体推进细节。</button></li>
            <li><button type="button" class="panel-c__item">您好，关于近期的工作安排，我想和您沟通一下各环节的对接要求。</button></li>
            <li><button type="button" class="panel-c__item">您好，关于本次项目的落地事宜，我想和您沟通一下当前的进度卡点。</button></li>
          </ul>
        </div>
      </div>
      <div class="composer">
        <input placeholder="输入消息" />
        <button type="button" class="send">发送</button>
      </div>
    </div>
    <aside class="note">
      <h2>方案 C · 草稿气泡</h2>
      <p>建议面板嵌入聊天流、靠右对齐，虚线绿框表示「待发草稿」。与 chat-C 原位展开思路一致，点击某条即发送。</p>
      <p><a href="./mol-suggest-index.html">← 返回索引</a></p>
    </aside>
  </body>
</html>
